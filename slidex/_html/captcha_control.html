<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刮刮乐验证控制面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .status.completed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status.connected .status-indicator {
            background: #28a745;
        }

        .status.disconnected .status-indicator {
            background: #dc3545;
        }

        .status.completed .status-indicator {
            background: #17a2b8;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .canvas-container {
            position: relative;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            max-height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #captchaCanvas {
            max-width: 100%;
            display: block;
            cursor: crosshair;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-card h3 {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-card p {
            color: #333;
            font-size: 18px;
            font-weight: bold;
        }

        .instructions {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .instructions h3 {
            color: #856404;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .instructions ol {
            margin-left: 20px;
            color: #856404;
        }

        .instructions li {
            margin-bottom: 5px;
        }

        .session-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .session-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
        }

        .session-input button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        /* 字符图形验证码输入面板（0.6.35）。视觉与 session-input 保持一致，
           否则同一页面里两种形态的控件看起来像来自不同产品。 */
        .text-input-panel {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            justify-content: center;
        }
        .text-input-panel input {
            flex: 1;
            max-width: 260px;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 20px;
            letter-spacing: 6px;
            text-align: center;
            text-transform: uppercase;
            font-family: monospace;
        }
        .text-input-panel input:focus {
            outline: none;
            border-color: #667eea;
        }
        .text-input-panel button {
            padding: 12px 24px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .text-input-panel button:hover {
            background: #218838;
        }
        .session-input button:hover {
            background: #5568d3;
        }

        .session-input button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .log {
            background: #2d3748;
            color: #a0aec0;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-entry.success {
            color: #48bb78;
        }

        .log-entry.error {
            color: #f56565;
        }

        .log-entry.info {
            color: #4299e1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 刮刮乐验证控制面板</h1>
        </div>

        <div id="status" class="status disconnected">
            <div class="status-indicator"></div>
            <span id="statusText">未连接</span>
        </div>

        <div id="recordingStatus" class="info-card" style="display:none; text-align:center; margin-bottom:15px;">
            <h3>🎬 录制状态</h3>
            <p id="recordingText" style="color:#dc3545;">🔴 录制中</p>
        </div>

        <div class="session-input">
            <input type="text" id="sessionIdInput" placeholder="输入会话ID（通常是用户ID）" />
            <input type="text" id="sessionTokenInput" placeholder="输入会话令牌" />
            <button id="connectBtn" onclick="connectSession()">连接</button>
        </div>

        <div class="instructions" id="instructions">
            <h3>📋 使用说明</h3>
            <ol id="instructionList">
                <li>输入会话ID并点击"连接"按钮</li>
                <li>等待页面截图加载</li>
                <li>使用鼠标在滑块按钮上按下并拖动</li>
                <li>释放鼠标完成验证</li>
            </ol>
        </div>

        <!-- 字符图形验证码：按 challenge_type 自动显示，无需用户手动切换 -->
        <div class="text-input-panel" id="textInputPanel" style="display:none;">
            <input type="text" id="charsInput" placeholder="输入图中验证码" maxlength="12"
                   autocomplete="off" autocapitalize="characters" spellcheck="false" />
            <button id="sendCharsBtn" onclick="sendTextInput()">提交字符</button>
        </div>

        <div class="info-panel">
            <div class="info-card">
                <h3>会话ID</h3>
                <p id="sessionIdDisplay">-</p>
            </div>
            <div class="info-card">
                <h3>连接状态</h3>
                <p id="connectionStatus">未连接</p>
            </div>
            <div class="info-card">
                <h3>验证状态</h3>
                <p id="verificationStatus">待处理</p>
            </div>
        </div>

        <div class="canvas-container" id="canvasContainer">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>
            <canvas id="captchaCanvas"></canvas>
        </div>

        <div class="log" id="log">
            <div class="log-entry info">等待连接...</div>
        </div>
    </div>

    <script>
        let ws = null;
        let currentSessionId = null;
        let canvas = null;
        let ctx = null;
        let isMouseDown = false;
        let lastMoveTime = 0;
        let moveThrottle = 5; // 节流：每10ms最多发送一次（极致流畅）
        let captchaOffset = {x: 0, y: 0}; // 滑块区域在页面中的偏移量
        let isRecording = true;
        let trajectoryPoints = [];
        let trajectoryStartX = 0, trajectoryStartY = 0;
        let currentSessionToken = null;
        // 当前挑战形态（0.6.35）。slider_captcha 拖拽；graph_chars 填字符；
        // point_select 点位置。后端 session_info 已在下发该字段，此前前端一直没读。
        let challengeType = 'slider_captcha';

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('captchaCanvas');
            ctx = canvas.getContext('2d');

            // 检查是否为嵌入模式（从URL参数或iframe检测）
            const urlParams = new URLSearchParams(window.location.search);
            const isEmbed = urlParams.get('embed') === '1' || window.self !== window.top;
            
            if (isEmbed) {
                // 隐藏不必要的元素
                document.querySelector('.header').style.display = 'none';
                document.querySelector('.session-input').style.display = 'none';
                // embed 下藏说明：这一模式已把 header / 日志 / 状态卡一并精简，
                // 是刻意做窄的界面，说明文字是全量版指引，留着反而是噪音。
                // 形态由可见的输入面板与「挑战类型：…」日志行点明。
                document.querySelector('.instructions').style.display = 'none';
                document.querySelector('.info-panel').style.display = 'none';
                document.querySelector('.log').style.display = 'none';
                document.getElementById('status').style.display = 'none';
                
                // 调整容器样式
                document.querySelector('.container').style.padding = '0';
                document.querySelector('.container').style.boxShadow = 'none';
                document.querySelector('.container').style.background = 'transparent';
                document.body.style.padding = '0';
            }

            // 检查是否有预设的会话ID（token 由服务端兑换 ticket 后注入，或用户手动填入）
            if (window.INITIAL_SESSION_TOKEN) {
                document.getElementById('sessionTokenInput').value = window.INITIAL_SESSION_TOKEN;
            }

            if (window.INITIAL_SESSION_ID) {
                document.getElementById('sessionIdInput').value = window.INITIAL_SESSION_ID;
                connectSession();
            }

            // 鼠标事件
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('mouseleave', handleMouseUp);
        });

        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateStatus(status, text) {
            const statusEl = document.getElementById('status');
            const statusTextEl = document.getElementById('statusText');
            
            statusEl.className = `status ${status}`;
            statusTextEl.textContent = text;
            
            document.getElementById('connectionStatus').textContent = text;
        }

        async function connectSession() {
            const sessionId = document.getElementById('sessionIdInput').value.trim();
            const sessionToken = document.getElementById('sessionTokenInput').value.trim();
            
            if (!sessionId || !sessionToken) {
                alert('请输入会话ID和会话令牌');
                return;
            }

            currentSessionId = sessionId;
            currentSessionToken = sessionToken;
            document.getElementById('sessionIdDisplay').textContent = sessionId;
            document.getElementById('connectBtn').disabled = true;

            log(`正在连接会话: ${sessionId}`, 'info');

            try {
                // 建立 WebSocket 连接：URL 不携带 token（避免进日志），
                // 连接建立后通过首条 auth 消息鉴权。
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${wsProtocol}//${window.location.host}/api/captcha/ws/${encodeURIComponent(sessionId)}`;
                log(`WebSocket URL: /api/captcha/ws/${sessionId}`, 'info');
                
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    ws.send(JSON.stringify({ type: 'auth', token: sessionToken }));
                    log('WebSocket 连接成功', 'success');
                    updateStatus('connected', '已连接');
                };

                ws.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                };

                ws.onerror = (error) => {
                    log(`WebSocket 错误: ${error}`, 'error');
                    updateStatus('disconnected', '连接错误');
                    document.getElementById('connectBtn').disabled = false;
                };

                ws.onclose = () => {
                    log('WebSocket 连接关闭', 'info');
                    updateStatus('disconnected', '连接已关闭');
                    document.getElementById('connectBtn').disabled = false;
                };

            } catch (error) {
                log(`连接失败: ${error}`, 'error');
                updateStatus('disconnected', '连接失败');
                document.getElementById('connectBtn').disabled = false;
            }
        }

        function applyChallengeType(type) {
            challengeType = type || 'slider_captcha';
            const isGraphChars = challengeType === 'graph_chars';
            const isPointSelect = challengeType === 'point_select';

            // 说明文案跟着形态走，否则文字点选用户会看到"按下并拖动"而不知为何。
            const list = document.getElementById('instructionList');
            if (list) {
                if (isGraphChars) {
                    list.innerHTML = '<li>输入会话ID并点击"连接"按钮</li>' +
                        '<li>等待验证码图片加载</li>' +
                        '<li>看清图中字符，在下方输入框逐字填写</li>' +
                        '<li>点击"提交字符"完成验证</li>';
                } else if (isPointSelect) {
                    list.innerHTML = '<li>输入会话ID并点击"连接"按钮</li>' +
                        '<li>等待页面截图加载</li>' +
                        '<li>按提示顺序，依次点击图中对应文字</li>' +
                        '<li>每次点击为一个独立动作，不要拖动</li>';
                } else {
                    list.innerHTML = '<li>输入会话ID并点击"连接"按钮</li>' +
                        '<li>等待页面截图加载</li>' +
                        '<li>使用鼠标在滑块按钮上按下并拖动</li>' +
                        '<li>释放鼠标完成验证</li>';
                }
            }

            const panel = document.getElementById('textInputPanel');
            if (panel) panel.style.display = isGraphChars ? 'flex' : 'none';

            if (isGraphChars) {
                log('挑战类型：字符图形验证码 —— 请填写图中字符', 'info');
            } else if (isPointSelect) {
                log('挑战类型：文字点选 —— 请依次点击对应文字', 'info');
            }
        }

        async function sendTextInput() {
            const input = document.getElementById('charsInput');
            const btn = document.getElementById('sendCharsBtn');
            if (!input || !ws || ws.readyState !== WebSocket.OPEN) {
                log('未连接到会话，无法提交', 'error');
                return;
            }
            const text = (input.value || '').trim();
            if (!text) {
                log('请先输入图中字符', 'error');
                return;
            }
            btn.disabled = true;
            document.getElementById('verificationStatus').textContent = '验证中...';
            log(`提交字符: ${text}`, 'info');
            ws.send(JSON.stringify({ type: 'text_input', text: text }));
            // 后端在填完字后回传截图（可能已换新图），由 screenshot_update 处理。
            // 这里不自行清空输入：若后端判错并换了新图，保留原值方便对照修正。
            setTimeout(() => { btn.disabled = false; }, 800);
        }

        // Enter 直接提交，省一次点击（人工接管的场景下每一步都要快）。
        document.addEventListener('DOMContentLoaded', () => {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && document.activeElement &&
                    document.activeElement.id === 'charsInput') {
                    e.preventDefault();
                    sendTextInput();
                }
            });
        });

        function handleWebSocketMessage(data) {
            const type = data.type;

            if (type === 'session_info') {
                log('收到会话信息', 'success');
                applyChallengeType(data.challenge_type);
                
                // 保存验证码容器偏移量
                if (data.captcha_info && data.captcha_info.x !== undefined) {
                    captchaOffset.x = Math.max(0, data.captcha_info.x - 10);
                    captchaOffset.y = Math.max(0, data.captcha_info.y - 10);
                    log(`验证码容器偏移: (${captchaOffset.x}, ${captchaOffset.y})`, 'info');
                    log(`容器大小: ${data.captcha_info.width}x${data.captcha_info.height}`, 'info');
                }
                
                displayScreenshot(data.screenshot);
            }

            else if (type === 'screenshot_update') {
                displayScreenshot(data.screenshot);
                
                // 如果是在等待验证结果时收到截图更新，说明验证失败
                const currentStatus = document.getElementById('verificationStatus').textContent;
                if (currentStatus === '验证中...') {
                    log('⚠️ 验证未通过，请重试', 'error');
                    document.getElementById('verificationStatus').textContent = '待处理';
                }
            }

            else if (type === 'completed') {
                log('✅ 验证成功！', 'success');
                updateStatus('completed', '验证成功');
                document.getElementById('verificationStatus').textContent = '已完成';
                submitTrajectory();
                
                // 显示成功提示
                setTimeout(() => {
                    alert('✅ 验证成功！页面即将关闭...');
                    if (ws) {
                        ws.close();
                    }
                }, 500);
            }
            else if (type === 'error') {
                log(`错误: ${data.message}`, 'error');
            }
        }

        function displayScreenshot(base64Image) {
            const img = new Image();
            img.onload = () => {
                // 调整 canvas 大小（只在必要时调整）
                if (canvas.width !== img.width || canvas.height !== img.height) {
                    canvas.width = img.width;
                    canvas.height = img.height;
                }
                
                // 使用 imageSmoothingEnabled 优化渲染
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'low'; // 低质量平滑，提升性能
                
                // 绘制图片
                ctx.drawImage(img, 0, 0);
                
                // 隐藏加载提示
                document.getElementById('loading').style.display = 'none';
                canvas.style.display = 'block';
            };
            // 使用 JPEG 格式（后端已改为 JPEG）
            img.src = `data:image/jpeg;base64,${base64Image}`;
        }

        function handleMouseDown(event) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }

            const coords = getMouseCoords(event);

            // 文字点选（0.6.35）：一次按下即一次点击，没有"拖"这回事。
            // 若照走 down/move/up 路径，松手时会被当成一次拖动结束——
            // 而点选挑战的语义是"点某位置"，那会让后端收到不该有的移动序列。
            if (challengeType === 'point_select') {
                log(`点击: (${coords.x}, ${coords.y})`, 'info');
                document.getElementById('verificationStatus').textContent = '验证中...';
                ws.send(JSON.stringify({
                    type: 'mouse_event',
                    event_type: 'click',
                    x: coords.x,
                    y: coords.y
                }));
                return;
            }

            isMouseDown = true;
            log(`鼠标按下: (${coords.x}, ${coords.y})`, 'info');
            
            ws.send(JSON.stringify({
                type: 'mouse_event',
                event_type: 'down',
                x: coords.x,
                y: coords.y
            }));
            // 录制起始点
            if (isRecording) {
                trajectoryPoints = [];
                trajectoryStartX = coords.x;
                trajectoryStartY = coords.y;
            }
        }

        function handleMouseMove(event) {
            // 点选模式下 press 只用于发一次 click，没有按住态；后续 move/up
            // 都不该再发（否则又变回拖动语义）。
            if (challengeType === 'point_select') {
                return;
            }
            if (!ws || ws.readyState !== WebSocket.OPEN || !isMouseDown) {
                return;
            }

            // 节流：限制发送频率，避免卡顿
            const now = Date.now();
            if (now - lastMoveTime < moveThrottle) {
                return; // 跳过这次事件
            }
            lastMoveTime = now;

            const coords = getMouseCoords(event);
            
            ws.send(JSON.stringify({
                type: 'mouse_event',
                event_type: 'move',
                x: coords.x,
                y: coords.y
            }));
            if (isRecording) {
                trajectoryPoints.push({
                    x: coords.x, y: coords.y, t: Date.now()
                });
            }
        }

        function handleMouseUp(event) {
            if (challengeType === 'point_select') {
                return;
            }
            if (!ws || ws.readyState !== WebSocket.OPEN || !isMouseDown) {
                return;
            }

            isMouseDown = false;
            const coords = getMouseCoords(event);
            
            log(`鼠标释放: (${coords.x}, ${coords.y})`, 'info');
            log(`等待验证结果...`, 'info');
            
            // 更新状态显示
            document.getElementById('verificationStatus').textContent = '验证中...';
            
            ws.send(JSON.stringify({
                type: 'mouse_event',
                event_type: 'up',
                x: coords.x,
                y: coords.y
            }));
            if (isRecording && trajectoryStartX) {
                const finalX = coords.x;
                const finalY = coords.y;
                const distance = Math.abs(finalX - trajectoryStartX);
                window._pendingTrajectory = {
                    points: trajectoryPoints,
                    startX: trajectoryStartX,
                    startY: trajectoryStartY,
                    endX: finalX,
                    endY: finalY,
                    distance: Math.round(distance * 10) / 10,
                };
            }
        }

        function getMouseCoords(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            // 计算canvas上的坐标
            const canvasX = Math.round((event.clientX - rect.left) * scaleX);
            const canvasY = Math.round((event.clientY - rect.top) * scaleY);
            
            // 转换为页面上的实际坐标（加上偏移量）
            return {
                x: canvasX + captchaOffset.x,
                y: canvasY + captchaOffset.y
            };
        }

        async function submitTrajectory() {
            if (!window._pendingTrajectory || !currentSessionId || !currentSessionToken) return;
            const t = window._pendingTrajectory;
            if (!t.points || t.points.length < 3) return;

            // 计算归一化轨迹点 [(dx, dy, delay_ms), ...]
            const normPoints = [];
            let prevT = t.points[0].t;
            normPoints.push([0, 0, 120]); // 起始点
            for (const p of t.points) {
                const dt = Math.max(5, p.t - prevT);
                const dx = p.x - t.startX;
                const dy = p.y - t.startY;
                normPoints.push([Math.round(dx * 100) / 100, Math.round(dy * 100) / 100, Math.round(dt * 10) / 10]);
                prevT = p.t;
            }

            const cookieId = currentSessionId.replace(/^slider_fallback_/, "").replace(/_\d+$/, "");
            log(`📤 正在提交轨迹... (${normPoints.length} points, distance=${t.distance}px)`, "info");

            try {
                const resp = await fetch("/api/captcha/trajectory", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Captcha-Token": currentSessionToken,
                    },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        cookie_id: cookieId,
                        points: normPoints,
                        distance: t.distance,
                        verify_url: "",
                    }),
                });
                const result = await resp.json();
                if (result.success) {
                    log("✅ 轨迹已保存！", "success");
                    document.getElementById("recordingStatus").style.display = "block";
                    document.getElementById("recordingText").style.color = "#28a745";
                    document.getElementById("recordingText").textContent = "🟢 已保存 (" + normPoints.length + " points)";
                } else {
                    log("⚠️ 轨迹保存失败: " + (result.message || "unknown"), "warn");
                }
            } catch (e) {
                log("❌ 轨迹提交失败: " + e.message, "error");
            }
            window._pendingTrajectory = null;
        }

    </script>
