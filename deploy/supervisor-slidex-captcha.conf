# slidex captcha 服务 supervisor 程序配置（无 systemd 宿主，如 pxed）。
# 安装：sudo cp supervisor-slidex-captcha.conf /personal/pxed/ && 把路径加进
#       主 supervisord.conf 的 files= 列表，然后 reread+update。
# systemd 宿主改用 slidex-captcha.service。
[program:slidex-captcha]
command=/opt/slidex-captcha/.venv/bin/uvicorn slidex.service.app:app --host 0.0.0.0 --port 8077 --workers 1 --log-level info
directory=/opt/slidex-captcha
environment=PYTHONUNBUFFERED="1"
; workers 必须为 1：chromium 农场（共享浏览器）只在 worker 进程内存活，
; 多 worker 会各自拉起 chromium，内存翻倍。
autostart=true
autorestart=true
startretries=5
stopwaitsecs=20
priority=400
stdout_logfile=/personal/pxed/logs/slidex-captcha.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
