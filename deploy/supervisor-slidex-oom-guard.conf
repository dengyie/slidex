# slidex chrome OOM 护卫 supervisor 程序（配套 oom_guard.sh）。
[program:slidex-oom-guard]
command=/opt/slidex-captcha/bin/oom_guard.sh
autostart=true
autorestart=true
startretries=3
priority=399
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/personal/pxed/logs/oom-guard.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true
