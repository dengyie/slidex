name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: slidex
      - uses: actions/checkout@v4
        with:
          repository: dengyie/automation-kit
          path: automation-kit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ./automation-kit
      - run: python -m pip install -e './slidex[dev,remote]'
      - run: python -m pytest -q
        working-directory: slidex
