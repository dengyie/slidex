[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slidex"
version = "0.6.11"
description = "专业滑块验证码求解库 | Professional Slider CAPTCHA Solver — Multi-provider auto-detection, CDP mode, plugin-extensible"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Slidex Authors"}]
keywords = ["captcha", "slider", "nocaptcha", "playwright", "opencv", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "loguru>=0.7.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "playwright>=1.45.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
automation-kit = [
    "automation-kit>=0.4.0,<0.5.0",
]
# 纯图片无块图缺口检测的可选深度学习后端（YOLO/ONNX，自带模型权重）。
# 未安装时 SliderImageSolver 静默回退到零依赖的模板匹配 / 轮廓 / 列剖面策略。
vision = [
    "captcha-recognizer>=1.0.0,<2.0.0",
]
remote = [
    "fastapi>=0.111.0,<2.0.0",
    # fastapi 自身的范围允许 starlette 跨 major，而其 major 会改 TestClient / WS
    # 行为（1.0 起 TestClient 改依赖 httpx2，曾让 CI 自 0.5.4 起全红），显式锁 major。
    "starlette<2.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-timeout>=2.0,<3.0",
    "pytest-mock>=3.12,<4.0",
    # starlette>=1.0 的 TestClient 需要 httpx2（httpx 的继任包），仅测试用
    "httpx2>=2.0.0,<3.0.0",
]
all = [
    "slidex[automation-kit,remote,vision,dev]",
]

[tool.setuptools.packages.find]
include = ["slidex*", "demo*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["manual"]
addopts = "-v --tb=short"
